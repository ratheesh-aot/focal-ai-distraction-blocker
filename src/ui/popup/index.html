<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Distraction Blocker</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <header>
    <div>
      <h1 id="host">This page</h1>
      <p id="model" class="muted"><span class="dot"></span><span id="model-text">Checking model…</span></p>
    </div>
    <label class="switch" title="Turn the blocker on or off for this site">
      <input type="checkbox" id="site-toggle" />
      <span>On</span>
    </label>
  </header>

  <section id="summary" class="panel">
    <div class="big"><strong id="hidden-count">0</strong> hidden on this page</div>
    <ul id="categories" class="counts"></ul>
    <p id="sources" class="muted small"></p>
    <p id="network" class="muted small"></p>
  </section>

  <p id="unavailable" class="muted" hidden>The blocker does not run on this page.</p>

  <div class="actions">
    <button type="button" id="show-hidden">Show hidden</button>
    <button type="button" id="undo">Undo all on this site</button>
  </div>

  <footer><a href="#" id="open-options">Settings</a></footer>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
